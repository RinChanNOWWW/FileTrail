name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Check version is not already tagged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject an existing version tag
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          tag = f"v{version}"
          tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
          if tag in tags:
              print(
                  f"::error file=Cargo.toml::Tag {tag} already exists on GitHub. "
                  "Bump package.version in Cargo.toml to a new version and update Cargo.lock."
              )
              raise SystemExit(1)
          print(f"Version {version} is available: tag {tag} does not exist.")
          PY

  format:
    name: Rust and TOML formatting
    needs: version
    # Tag-triggered release checks intentionally skip the PR-only version job.
    if: >-
      ${{ !cancelled() && (needs.version.result == 'success' ||
          (github.event_name != 'pull_request' && needs.version.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Check Rust formatting (one import per line)
        run: cargo fmt --all -- --check
      - name: Install pinned TOML formatter
        run: cargo install taplo-cli --version 0.10.0 --locked
      - name: Check TOML formatting and alphabetical key order
        run: taplo fmt --check
      - name: Validate Cargo manifest schema
        run: taplo lint Cargo.toml

  check:
    name: Check, Clippy, tests, and binary (${{ matrix.os }})
    needs: format
    # Allow the skipped version ancestor on releases, but require formatting to pass.
    if: ${{ !cancelled() && needs.format.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Compile all targets
        run: cargo check --locked --all-targets
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install shells for completion tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install Fish for completion tests (macOS)
        if: runner.os == 'macOS'
        run: command -v fish >/dev/null || brew install fish
      - name: Unit and integration tests
        run: cargo test --locked --all-targets
      - name: Documentation tests
        run: cargo test --locked --doc
      - name: Build standalone binary
        run: cargo build --locked --release
      - name: Smoke test
        run: ./target/release/filetrail --help
      - name: Verify crates.io package without publishing
        run: cargo publish --dry-run --locked --registry crates-io
      - name: Package standalone binary
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          target=$(rustc -vV | sed -n 's/^host: //p')
          package="filetrail-v${version}-${target}"
          mkdir -p "target/dist/$package" target/artifacts
          cp target/release/filetrail LICENSE README.md README_zh.md "target/dist/$package/"
          tar -czf "target/artifacts/$package.tar.gz" -C target/dist "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: filetrail-${{ runner.os }}-${{ runner.arch }}
          path: target/artifacts/*.tar.gz
          if-no-files-found: error
