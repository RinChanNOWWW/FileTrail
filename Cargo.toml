[package]
description = "Watch files, sync them into a Git repository, and commit on your terms."
edition = "2024"
license = "MIT"
name = "filetrail"
repository = "https://github.com/RinChanNOWWW/FileTrail"
version = "0.2.0"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { features = ["derive"], version = "4.5" }
clap_complete = "4.5"
ctrlc = { features = ["termination"], version = "3.4" }
dirs = "6.0"
fs2 = "0.4"
git2 = { default-features = false, features = ["vendored-libgit2"], version = "0.20" }
globset = "0.4"
notify = "8.2"
rusqlite = { features = ["bundled"], version = "0.40" }
serde = { features = ["derive"], version = "1.0" }
shlex = "2.0"
tempfile = "3.20"
toml = "0.9"
walkdir = "2.5"

[lints.cargo]
# Cargo explicitly inserts readme into the packaged manifest on the pinned nightly.
manual_readme = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
